<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-body">
    <div id="sidebar">
      <div id="sidebar-header" data-tauri-drag-region></div>
    </div>
    <div id="sidebar-resizer"></div>
    <div id="main">
      <div id="tab-bar" data-tauri-drag-region>
        <button id="sidebar-toggle" title="Masquer la sidebar" aria-label="Masquer la sidebar">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2" xmlns="http://www.w3.org/2000/svg">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
            <line x1="6" y1="2.5" x2="6" y2="13.5" />
            <rect x="1.5" y="2.5" width="4.5" height="11" rx="2" fill="currentColor" fill-opacity="0.7" stroke="none" />
          </svg>
        </button>
      </div>
      <button id="sidebar-show-floating" title="Afficher la sidebar" aria-label="Afficher la sidebar">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
          <line x1="6" y1="2.5" x2="6" y2="13.5" />
        </svg>
      </button>
      <div id="content-scroll">
        <div id="content"></div>
        <div id="content-actions">
          <button id="refresh-btn" title="Rafraîchir">⟳</button>
          <button id="width-toggle" title="Pleine largeur">⬌</button>
        </div>
      </div>
      <div id="empty-state">Ouvrir un fichier Markdown pour commencer</div>
    </div>
  </div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
